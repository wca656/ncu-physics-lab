<svg xmlns="http://www.w3.org/2000/svg" width="840" height="170" viewBox="0 0 840 170" role="img" aria-label="南昌大学 Nanchang University">
  <defs>
    <linearGradient id="ncuBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a3d91"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 圆形校徽底 -->
  <circle cx="85" cy="85" r="72" fill="url(#ncuBlue)"/>
  <circle cx="85" cy="85" r="72" fill="none" stroke="#ffffff" stroke-width="3"/>
  <circle cx="85" cy="85" r="58" fill="none" stroke="#ffd54f" stroke-width="2"/>

  <!-- 徽标内图形：书本 + 原子轨道（象征物理与学术） -->
  <ellipse cx="85" cy="92" rx="34" ry="12" fill="none" stroke="#ffffff" stroke-width="2.5"/>
  <ellipse cx="85" cy="92" rx="34" ry="12" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(60 85 92)"/>
  <ellipse cx="85" cy="92" rx="34" ry="12" fill="none" stroke="#ffffff" stroke-width="2.5" transform="rotate(120 85 92)"/>
  <circle cx="85" cy="92" r="6" fill="#ffd54f"/>

  <!-- 校名（中英文） -->
  <text x="180" y="72" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="46" font-weight="700" fill="#0a3d91">南昌大学</text>
  <text x="182" y="104" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="2.5" fill="#1565c0">NANCHANG UNIVERSITY</text>
  <text x="182" y="136" font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="17" letter-spacing="1" fill="#607d8b">大学物理实验 · 个人作品集</text>
</svg>
